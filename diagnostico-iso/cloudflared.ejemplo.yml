# Configuración del túnel de Cloudflare para diagnosticoiso.proyectoia.org (esquema por aplicación).
# Este archivo lo completa deploy/tunel.sh con el ID del túnel y la ruta del archivo de credenciales.
tunnel: diagnosticoiso
credentials-file: ~/.cloudflared/diagnosticoiso.json
ingress:
  - hostname: diagnosticoiso.proyectoia.org
    service: http://localhost:3050
  - service: http_status:404
