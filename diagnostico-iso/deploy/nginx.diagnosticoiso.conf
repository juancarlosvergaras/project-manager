# /etc/nginx/sites-available/diagnosticoiso.proyectoia.org
server {
    listen 80;
    server_name diagnosticoiso.proyectoia.org;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name diagnosticoiso.proyectoia.org;

    # Certificados (p. ej. certbot --nginx -d diagnosticoiso.proyectoia.org)
    ssl_certificate     /etc/letsencrypt/live/diagnosticoiso.proyectoia.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diagnosticoiso.proyectoia.org/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;   # necesario para que la cookie de sesión se marque Secure
    }
}
