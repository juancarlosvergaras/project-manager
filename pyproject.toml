[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tecladoia"
version = "1.2.0"
description = "Puente en español entre un teclado AhaKey-X1 y los agentes de IA (Codex, Claude Code, Cursor, Kimi, Gemini)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["teclado", "ble", "ia", "codex", "claude", "cursor", "gemini", "espanol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22"]
# Para que la tecla del microfono sepa donde esta el cuadro de escribir de cada
# programa en vez de adivinarlo. Sin esto se cae a un clic a ojo, que falla en
# cuanto el cuadro cambia de sitio.
cuadro = ["comtypes>=1.2"]
# MiniMic: el teclado de voz se configura por HID y su micrófono se maneja por COM.
minimic = ["hidapi>=0.14", "pycaw>=20240210", "comtypes>=1.2"]
# SikaiMini: mismo chip y mismas piezas que MiniMic.
sikaimini = ["hidapi>=0.14", "pycaw>=20240210", "comtypes>=1.2"]

[project.scripts]
tecladoia = "tecladoia.cli:main"
minimic = "minimic.cli:main"
sikaimini = "sikaimini.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# La carpeta web viaja con el paquete: sin ella el panel sale en blanco.
[tool.setuptools.package-data]
tecladoia = ["py.typed", "web/*"]
minimic = ["web/*"]
sikaimini = ["web/*"]
